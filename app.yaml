# app.yaml (Updated)
runtime: python311

env_variables:
  SECRET_KEY: "your-secret-key"
  FLASK_ENV: "production"
  CLAUDE_API_KEY: "your-api-key"

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6

# Handle file uploads
handlers:
- url: /api/resume/upload
  script: auto
  secure: always
  upload: .*

# Static files (if needed)
- url: /static
  static_dir: static
  secure: always

# Default handler
- url: /.*
  script: auto
  secure: always

# Allow larger file uploads (10MB)
env_variables:
  MAX_CONTENT_LENGTH: "10485760"  # 10MB in bytes