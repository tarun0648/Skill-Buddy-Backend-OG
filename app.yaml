# app.yaml (Updated for Profile Analysis)
runtime: python311

env_variables:
  SECRET_KEY: "your-secret-key"
  FLASK_ENV: "production"
  CLAUDE_API_KEY: "your-claude-api-key"
  GITHUB_TOKEN: "your-github-token-optional"

automatic_scaling:
  min_instances: 1
  max_instances: 15
  target_cpu_utilization: 0.6

# Handle file uploads
handlers:
- url: /api/resume/upload
  script: auto
  secure: always
  upload: .*

# Profile analysis endpoints
- url: /api/profile-analysis/.*
  script: auto
  secure: always

# Static files (if needed)
- url: /static
  static_dir: static
  secure: always

# Default handler
- url: /.*
  script: auto
  secure: always

# Allow larger file uploads (10MB) and longer processing times
env_variables:
  MAX_CONTENT_LENGTH: "10485760"  # 10MB in bytes

# Resource allocation for AI processing
resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

# Health check configuration
readiness_check:
  path: "/api/status"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

liveness_check:
  path: "/api/status"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2

# Additional scaling configuration for AI workloads
automatic_scaling:
  min_instances: 1
  max_instances: 20
  target_cpu_utilization: 0.7
  max_concurrent_requests: 10